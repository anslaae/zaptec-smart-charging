name: Scheduler tick

# Vercel Hobby cron jobs are capped at once/day, so this workflow stands in
# for Vercel Cron: it hits /api/cron/tick every 5 minutes instead. Repo is
# public and the APP_URL/CRON_SECRET repo secrets are set, so this runs for
# free (GitHub Actions minutes are unlimited on public repos).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/tick"
